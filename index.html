            <h1 class="page-title">Contact Us</h1>
            <p class="page-intro">Have a question about any product or order? Send us a message and our support team
                will
                reply quickly.</p>

            <div class="contact-layout">
                <section>
                    <form id="contact-form" action="#" method="post">
                        <fieldset>
                            <legend>Send us a message</legend>

                            <label for="fullname">Full Name</label>
                            <input name="full_name" type="text" id="fullname" placeholder="Enter your name" required>

                            <label for="email">Email</label>
                            <input name="email" type="email" id="email" placeholder="Enter your email" required>

                            <label for="phone">Phone</label>
                            <input name="phone" type="tel" id="phone" placeholder="Enter your phone" required>

                            <label for="subject">Subject</label>
                            <select id="subject" name="subject" required>
                                <option value="" selected disabled>Choose a subject</option>
                                <option value="technical support">Technical support</option>
                                <option value="order inquiry">Order inquiry</option>
                                <option value="other">Other</option>
                            </select>

                            <label for="message">Your Message</label>
                            <textarea id="message" name="message" placeholder="Enter your message" minlength="5"
                                maxlength="300" rows="5"></textarea>

                            <div class="check">
                                <input type="checkbox" id="terms" name="terms" required>
                                <label for="terms">I agree to the terms.</label>
                            </div>

                            <div class="btn-row">
                                <button type="submit">Send your message</button>
                                <button type="reset" class="secondary">Reset</button>

                    if (d.chg === 'theme') { THEME = x.checked ? 'dark' : 'light'; localStorage.setItem(K.theme, THEME); applyLang(); document.querySelectorAll('[data-chg="theme"]').forEach(i => i.checked = x.checked); return; }
                    if (d.chg === 'ost') {
                        const all = rd(K.orders, []), o = all.find(y => y.id === d.id); if (!o) return;
                        o.cancelled = x.value === 'Cancelled'; o.status = x.value; o.manual = true; wr(K.orders, all);
                        const n = rd(K.notifs, []); n.unshift({ text: 'Order ' + o.id + ' is now ' + x.value, href: 'index.html?page=orders', time: Date.now(), read: false }); wr(K.notifs, n.slice(0, 30));
                        log('log_order', '', o.id + ' → ' + x.value); render(); toast(t('o_updated')); return;
                    }
                    if (d.chg === 'pstock') { patchProduct(d.id, { stock: x.checked }); toast(t('saved')); return; }
                    if (d.chg === 'pvis') { patchProduct(d.id, { hidden: !x.checked }); toast(t('saved')); return; }
                    if (d.chg === 'tog') { const l = GL(d.m), r = l.find(y => y.id === d.id); if (r) { r[d.f] = x.checked; wr(MODS[d.m].k, l); } if (d.m === 'comp' || d.m === 'warn') render(); else toast(t('saved')); return; }
                    if (d.chg === 'cublock') { const u = rd(K.ustat, {}); u[d.id] = { ...(u[d.id] || {}), blocked: !x.checked }; wr(K.ustat, u); toast(t('saved')); return; }
                    if (d.chg === 'govact') { const gs = GOVS(), g = gs.find(y => y.id === d.id); g.active = x.checked; saveGov(gs); toast(t('saved')); return; }
                    if (d.chg === 'aact' || d.chg === 'afee') { const gs = GOVS(), g = gs.find(y => y.id === d.g), a = g.areas[+d.i]; if (d.chg === 'aact') a.active = x.checked; else a.fee = x.value === '' ? '' : +x.value; saveGov(gs); return; }
                    if (x.id === 'file' && x.files[0]) {
                        const r = new FileReader(); r.onload = () => {
                            try { const j = JSON.parse(r.result); if (!confirm(t('restore_conf'))) return; Object.keys(j).filter(k => k.startsWith('boda_')).forEach(k => localStorage.setItem(k, j[k])); LG = localStorage.getItem(K.lang) || LG; THEME = localStorage.getItem(K.theme) === 'dark' ? 'dark' : 'light'; applyLang(); render(); toast(t('restore_ok')); } catch (z) { alert(t('restore_bad')); }
                        }; r.readAsText(x.files[0]); x.value = '';
                    }
                });
                document.addEventListener('submit', e => {
                    const f = e.target; e.preventDefault(); const err = f.querySelector('.err'), v = n => f.elements[n].value.trim();
                    if (f.id === 'lf') { if (tryLogin(v('u'), f.elements.p.value)) { sessionStorage.setItem('boda_admin', '1'); sessionStorage.setItem('boda_admin_user', v('u')); log('log_login'); gate(); } else $('#lerr').textContent = t('login_err'); return; }
                    if (f.id === 'hf') {
                        const i = +f.dataset.i; if (!v('title')) { err.textContent = t('h_err'); return; }
                        const rec = { badge: v('badge'), title: v('title'), text: v('text'), b1: v('b1'), l1: v('l1'), b2: v('b2'), l2: v('l2'), emojis: v('emojis'), img: v('img') };
                        const h = HERO(); if (i >= 0) h[i] = rec; else h.push(rec); wr(K.hero, h); $('#dlg').close(); log('log_save', 'n_hero'); render(); toast(t('saved')); return;
                    }
                    if (f.id === 'sf') {
                        const c = n => f.elements[n].checked;
                        wr(K.site, { announce: { show: c('show'), text: v('text'), linkText: v('linkText'), linkHref: v('linkHref') }, contact: { email: v('email'), phone: v('phone'), address: v('address'), hours: v('hours') }, general: { name: v('gname') || 'Boda Store', free: +v('free') || 0, low: +v('low') || 0, tax: +v('tax') || 0, maint: c('maint'), reg: c('reg'), guest: c('guest'), reviews: c('reviews'), mail: c('mail') } });
                        log('log_save', 'n_settings'); toast(t('s_saved')); return;
                    }
                    if (f.id === 'pwf') {
                        if (!tryLogin(me(), f.elements.cur.value)) { err.textContent = t('s_pwbad'); return; }
                        const np = f.elements.nw.value; if (np.length < 6) { err.textContent = t('u_err_pass'); return; }
                        if (me() === ADMIN.user) wr(K.apw, hash(np)); else { const us = USERS(), u = us.find(a => a.u === me()); if (u) { u.h = hash(np); wr(K.users, us); } }
                        f.reset(); err.textContent = ''; toast(t('s_pwok')); return;
                    }
                    if (f.id === 'nf') {
                        const text = v('text'); if (!text) return; const now = Date.now(), href = v('href') || 'index.html';
                        const n = rd(K.notifs, []); n.unshift({ text, href, time: now, read: false }); wr(K.notifs, n.slice(0, 50));
                        const h = rd(K.nlog, []); h.unshift({ text, href, time: now }); wr(K.nlog, h.slice(0, 100));
                        log('log_notif', '', text.slice(0, 40)); render(); toast(t('nt_sent')); return;
                    }
                    if (f.id === 'cnf') { const u = rd(K.ustat, {}); u[f.dataset.id] = { ...(u[f.dataset.id] || {}), note: v('note') }; wr(K.ustat, u); $('#dlg').close(); toast(t('saved')); return; }
                    if (f.id === 'af') {
                        const gs = GOVS(), g = gs.find(x => x.id === f.dataset.g), n = v('n'); if (!n) return;
                        g.areas.push({ n, fee: v('fee') === '' ? '' : +v('fee'), active: true }); saveGov(gs); open(areasHtml(g.id)); return;
                    }
                    if (f.id === 'gvf') {
                        const gs = GOVS(), id = f.dataset.id, rec = { n: v('n'), en: v('en'), fee: +v('fee') || 0, active: f.elements.active.checked };
                        if (!rec.n) { err.textContent = t('req_err'); return; }
                        if (id) Object.assign(gs.find(g => g.id === id), rec); else gs.push({ id: 'G' + Date.now().toString(36), areas: [], ...rec });
                        saveGov(gs); $('#dlg').close(); log('log_save', 'n_govs', rec.n); render(); toast(t('saved')); return;
                    }
                    if (f.id === 'gf') {
                        const k = f.dataset.m, m = MODS[k], id = f.dataset.id, r = readForm(m, f);
                        const miss = m.fields.find(x => x.req && (r[x.n] === '' || r[x.n] == null)); if (miss) { err.textContent = t('req_err'); return; }
                        const list = GL(k), old = id ? list.find(x => x.id === id) : null;
                        if (m.val) { const z = m.val(r, old, list); if (z) { err.textContent = t(z); return; } }
                        if (m.pre) m.pre(r, old, list);
                        if (old) Object.assign(old, r); else list.unshift({ id: 'X' + Date.now().toString(36), created: Date.now(), ...r });
                        wr(m.k, list); $('#dlg').close(); log('log_save', m.ti); render(); toast(t('saved')); return;
                    }
                    if (f.id === 'pf') {
                        const price = +f.elements.price.value, old = +f.elements.old.value || 0, name = v('name'); if (!name || !(price >= 0)) { err.textContent = t('p_err'); return; }
                        const bk = f.elements.bk.value, qty = v('qty');
                        const rec = {
                            name, cat: f.elements.cat.value, sub: f.elements.sub.value, price, old: old > price ? old : 0, qty: qty === '' ? null : +qty, brand: v('brand'), warranty: v('warranty'), options: v('options').split(/[,،]/).map(s => s.trim()).filter(Boolean),
                            img: v('img'), gallery: f.elements.gallery.value.split('\n').map(s => s.trim()).filter(Boolean), desc: v('desc'), long: v('long'), features: f.elements.features.value.split('\n').map(s => s.trim()).filter(Boolean),
                            badge: bk === 'new' ? 'NEW' : bk === 'auto' ? (old > price ? '🔥 ' + Math.round((old - price) / old * 100) + '% OFF' : '') : bk === 'custom' ? v('bt') : '', stock: f.elements.stock.checked, hidden: !f.elements.visible.checked
                        };
                        if (rec.qty === 0) rec.stock = false;
                        const id = f.dataset.id;
                        if (id) patchProduct(id, rec);
                        else { const a = PA(), code = f.elements.code ? v('code') : ''; if (code && (catalog().some(p => p.id === code) || baseIds().includes(code))) { err.textContent = t('p_dupcode'); return; } a.added.push({ ...rec, id: code || 'ADM' + Date.now().toString(36).toUpperCase() }); wr(K.pa, a); }
                        $('#dlg').close(); log('log_save', 'm_products', name); render(); toast(t('saved')); return;
                    }
                    if (f.id === 'cf') {
                        const cs = CATS().map(c => ({ ...c })), name = v('name'), id = f.dataset.id;
                        const rec = { name, icon: v('icon'), shop: v('shop') || 'Shop ' + name, desc: v('desc'), long: v('long') || v('desc'), subs: f.elements.subs.value.split(/[\n,،]/).map(s => s.trim()).filter(Boolean) };
                        if (!name) { err.textContent = t('req_err'); return; }
                        if (id) { const i = cs.findIndex(c => c.name === id); cs[i] = { ...cs[i], ...rec, name: id }; }
                        else { if (cs.some(c => c.name.toLowerCase() === name.toLowerCase())) { err.textContent = t('c_exists'); return; } cs.push(rec); }
                        wr(K.cats, cs); $('#dlg').close(); log('log_save', 'm_cats', name); render(); toast(t('saved'));
                    }
                });
                applyLang();
                gate();
            })();
        </script>
    </template>
    <script>
        (function () {
            var page = new URLSearchParams(location.search).get('page') || 'home';
            var template = document.querySelector('template[data-page="' + page + '"]') || document.querySelector('template[data-page="home"]');
            var content = template.content.cloneNode(true);
            var scripts = Array.prototype.slice.call(content.querySelectorAll('script'));
            scripts.forEach(function (script) { script.remove(); });
            if (window.BODA_ADMIN) { document.querySelectorAll('link[rel="stylesheet"]').forEach(function (l) { if ((l.getAttribute('href') || '').indexOf('style.css') > -1) l.disabled = true; }); }
            document.body.className = template.dataset.class || '';
            document.title = template.dataset.title || 'Boda Store';
            document.documentElement.lang = template.dataset.lang || 'en';
            document.documentElement.dir = template.dataset.dir || 'ltr';
            document.body.replaceChildren(content);
            window.addEventListener('load', function () {
                if (template.dataset.dir) {
                    document.documentElement.lang = template.dataset.lang || 'en';
                    document.documentElement.dir = template.dataset.dir;
                }
                scripts.forEach(function (source) {
                    var script = document.createElement('script');
                    script.textContent = source.textContent;
                    document.body.appendChild(script);
                });
            }, { once: true });
        })();
    </script>
