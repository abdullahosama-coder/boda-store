        <main>
            <h1 class="page-title">Contact Us</h1>
            <p class="page-intro">Have a question about any product or order? Send us a message and our support team
                will
                reply quickly.</p>

            <div class="contact-layout">
                <section>
                    <form id="contact-form" action="#" method="post">
                        <fieldset>
                            <legend>Send us a message</legend>

                            <label for="fullname">Full Name</label>
                            <input name="full_name" type="text" id="fullname" placeholder="Enter your name" required>

                            <label for="email">Email</label>
                            <input name="email" type="email" id="email" placeholder="Enter your email" required>

                            <label for="phone">Phone</label>
                            <input name="phone" type="tel" id="phone" placeholder="Enter your phone" required>

                            <label for="subject">Subject</label>
                            <select id="subject" name="subject" required>
                                <option value="" selected disabled>Choose a subject</option>
                                <option value="technical support">Technical support</option>
                                <option value="order inquiry">Order inquiry</option>
                                <option value="other">Other</option>
                            </select>

                            <label for="message">Your Message</label>
                            <textarea id="message" name="message" placeholder="Enter your message" minlength="5"
                                maxlength="300" rows="5"></textarea>

                            <div class="check">
                                <input type="checkbox" id="terms" name="terms" required>
                                <label for="terms">I agree to the terms.</label>
                            </div>

                            <div class="btn-row">
                                <button type="submit">Send your message</button>
                                <button type="reset" class="secondary">Reset</button>
                            </div>
                            <p class="form-msg">Thanks! Your message was sent.</p>
                        </fieldset>
                    </form>
                </section>

                <aside class="contact-card">
                    <h2>Store Info</h2>
                    <p>📧 Email: info@bodastore.com</p>
                    <p>📞 Phone: +20 100 000 0000</p>
                    <p>📍 Address: Alexandria, Egypt</p>
                    <p>🕒 Open daily, 10 AM to 9 PM</p>
                </aside>
            </div>

<script>
(function () {
// ⚠ بيانات الدخول مكتوبة هنا في الصفحة (حماية أولية فقط). غيّرها، ولما تنشر الموقع فعليًا لازم تحمي اللوحة من السيرفر.
const ADMIN = { user: 'admin', pass: 'Boda@2026' };
const K = { orders: 'boda_orders', acc: 'boda_accounts', msgs: 'boda_messages', news: 'boda_newsletter', cats: 'boda_categories', pa: 'boda_admin_products', notifs: 'boda_notifs' };
const $ = (s, r = document) => r.querySelector(s);
const rd = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const wr = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US');
const when = t => new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
const ST = { Pending: ['قيد الانتظار', 'warn'], Processing: ['قيد التجهيز', 'info'], Shipped: ['تم الشحن', 'info'], Delivered: ['تم التسليم', 'ok'], Cancelled: ['ملغي', 'bad'] };
const STEPS = ['Pending', 'Processing', 'Shipped', 'Delivered'], STEP_MIN = [0, 1, 3, 6];
const S = { ost: '', oq: '', pq: '', pc: '' };

function stOf(o) { // same logic as the store, plus manual status set from this panel
  if (o.cancelled) return 'Cancelled';
  if (o.manual) return o.status;
  const m = (Date.now() - o.created) / 6e4; let s = 0; STEP_MIN.forEach((t, i) => { if (m >= t) s = i; }); return STEPS[s];
}
const pill = s => `<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
const orders = () => rd(K.orders, []).map(o => ({ ...o, s: stOf(o) }));
const PA = () => { const d = rd(K.pa, {}); return { edits: d.edits || {}, added: d.added || [], deleted: d.deleted || [] }; };
const baseIds = () => BODA_PRODUCTS.map(p => p.id);
function catalog() { const a = PA(); return BODA_PRODUCTS.map(p => ({ ...p, ...(a.edits[p.id] || {}) })).concat(a.added).filter(p => !a.deleted.includes(p.id)); }
const CATS = () => rd(K.cats, null) || BODA_CATEGORIES_DEFAULT;
function toast(t) { document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

/* ---------- Views ---------- */
function dash() {
  const o = orders(), live = o.filter(x => x.s !== 'Cancelled'), rev = live.reduce((s, x) => s + x.total, 0);
  const acc = Object.keys(rd(K.acc, {})).length, cat = catalog(), out = cat.filter(p => p.stock === false).length;
  const cnt = k => o.filter(x => x.s === k).length, max = Math.max(1, ...Object.keys(ST).map(cnt));
  const top = {}; live.forEach(x => x.items.forEach(i => { top[i.id] = top[i.id] || { n: i.name, q: 0, v: 0 }; top[i.id].q += i.qty; top[i.id].v += i.qty * i.price; }));
  const tops = Object.values(top).sort((a, b) => b.q - a.q).slice(0, 5);
  return `<h1>الرئيسية</h1><p class="sub">ملخص سريع لحالة المتجر.</p>
  <div class="kpis">
    <div class="kpi"><span>إجمالي المبيعات</span><strong>${money(rev)}</strong><small>بدون الطلبات الملغية</small></div>
    <div class="kpi"><span>الطلبات</span><strong>${o.length}</strong><small>${o.filter(x => ['Pending', 'Processing', 'Shipped'].includes(x.s)).length} طلب جاري</small></div>
    <div class="kpi"><span>العملاء</span><strong>${acc}</strong><small>${rd(K.news, []).length} مشترك في النشرة</small></div>
    <div class="kpi"><span>المنتجات</span><strong>${cat.length}</strong><small>${out} غير متوفر</small></div>
  </div>
  <div class="cols">
    <div class="box"><h2>الطلبات حسب الحالة</h2>${Object.keys(ST).map(k => `<div class="bar-row"><span>${ST[k][0]}</span><i style="width:${cnt(k) / max * 100}%"></i><b>${cnt(k)}</b></div>`).join('')}</div>
    <div class="box"><h2>الأكثر مبيعًا</h2>${tops.length ? `<table><tbody>${tops.map(t => `<tr><td class="wrap">${esc(t.n)}</td><td>${t.q} قطعة</td><td>${money(t.v)}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">لسه مفيش مبيعات.</p>'}</div>
  </div>
  <div class="box"><h2>آخر الطلبات</h2>${o.length ? ordersTbl(o.slice(0, 6), true) : '<p class="empty">الطلبات اللي العملاء يعملوها من المتجر هتظهر هنا.</p>'}</div>`;
}

function ordersTbl(list, ro) {
  return `<div class="tw"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الإجمالي</th><th>الدفع</th><th>التاريخ</th><th>الحالة</th>${ro ? '' : '<th></th>'}</tr></thead><tbody>${list.map(o => `<tr>
    <td><b>${esc(o.id)}</b></td><td>${esc(o.ship?.name)}<br><small>${esc(o.ship?.phone)}</small></td><td>${money(o.total)}</td><td>${esc(o.payment)}</td><td>${when(o.created)}</td>
    <td>${ro ? pill(o.s) : `<select data-chg="ost" data-id="${esc(o.id)}">${Object.keys(ST).map(k => `<option value="${k}" ${k === o.s ? 'selected' : ''}>${ST[k][0]}</option>`).join('')}</select>`}</td>
    ${ro ? '' : `<td><button class="mini" data-act="odetail" data-id="${esc(o.id)}">تفاصيل</button><button class="mini del" data-act="odel" data-id="${esc(o.id)}">حذف</button></td>`}</tr>`).join('')}</tbody></table></div>`;
}
function ordersList() {
  const q = S.oq.toLowerCase();
  const l = orders().filter(o => (!S.ost || o.s === S.ost) && (!q || (o.id + ' ' + (o.ship?.name || '') + ' ' + (o.ship?.phone || '')).toLowerCase().includes(q)));
  return l.length ? ordersTbl(l) : '<div class="empty tw">مفيش طلبات مطابقة.</div>';
}
function ordersView() {
  return `<div class="head"><div><h1>الطلبات</h1><p class="sub">غيّر حالة الطلب والعميل هيوصله إشعار في المتجر.</p></div><button class="btn ghost" data-act="csv">تصدير CSV</button></div>
  <div class="filters"><input type="search" placeholder="بحث برقم الطلب أو الاسم أو التليفون" value="${esc(S.oq)}" oninput="S.oq=this.value;$('#tbl').innerHTML=ordersList()">
  <select onchange="S.ost=this.value;$('#tbl').innerHTML=ordersList()"><option value="">كل الحالات</option>${Object.keys(ST).map(k => `<option value="${k}" ${S.ost === k ? 'selected' : ''}>${ST[k][0]}</option>`).join('')}</select></div>
  <div id="tbl">${ordersList()}</div>`;
}

function prodList() {
  const q = S.pq.toLowerCase(), l = catalog().filter(p => (!S.pc || p.cat === S.pc) && (!q || (p.name + p.id).toLowerCase().includes(q)));
  return l.length ? `<div class="tw"><table><thead><tr><th></th><th>المنتج</th><th>القسم</th><th>السعر</th><th>المخزون</th><th>الظهور</th><th></th></tr></thead><tbody>${l.map(p => `<tr>
    <td><img src="${esc(p.img)}" alt="" onerror="this.style.visibility='hidden'"></td><td class="wrap"><b>${esc(p.name)}</b><br><small>${esc(p.id)}</small></td><td>${esc(p.cat)}<br><small>${esc(p.sub)}</small></td>
    <td>${p.old > p.price ? `<del><small>${money(p.old)}</small></del> ` : ''}<b>${money(p.price)}</b></td>
    <td><button class="mini" data-act="pstock" data-id="${esc(p.id)}">${p.stock === false ? '<span class="pill bad">غير متوفر</span>' : '<span class="pill ok">متوفر</span>'}</button></td>
    <td><button class="mini" data-act="pvis" data-id="${esc(p.id)}">${p.hidden ? '<span class="pill warn">مخفي</span>' : '<span class="pill ok">ظاهر</span>'}</button></td>
    <td><button class="mini" data-act="pedit" data-id="${esc(p.id)}">تعديل</button><button class="mini del" data-act="pdel" data-id="${esc(p.id)}">حذف</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty tw">مفيش منتجات مطابقة.</div>';
}
function productsView() {
  const del = PA().deleted.length;
  return `<div class="head"><div><h1>المنتجات</h1><p class="sub">أي تعديل بيظهر في المتجر فورًا.</p></div><div>${del ? `<button class="btn ghost" data-act="prestore">استرجاع المحذوف (${del})</button> ` : ''}<button class="btn" data-act="padd">+ منتج جديد</button></div></div>
  <div class="filters"><input type="search" placeholder="ابحث بالاسم أو الكود" value="${esc(S.pq)}" oninput="S.pq=this.value;$('#tbl').innerHTML=prodList()">
  <select onchange="S.pc=this.value;$('#tbl').innerHTML=prodList()"><option value="">كل الأقسام</option>${CATS().map(c => `<option ${S.pc === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div id="tbl">${prodList()}</div>`;
}
function pform(p) {
  const cs = CATS(); p = p || { cat: cs[0].name, stock: true };
  return `<form id="pf" data-id="${esc(p.id || '')}" data-sub="${esc(p.sub || '')}"><h3>${p.id ? 'تعديل منتج' : 'منتج جديد'}</h3>
  <div class="g2"><label>اسم المنتج<input name="name" required value="${esc(p.name)}"></label>
  <label>القسم<select name="cat" onchange="fillSubs(this.form)">${cs.map(c => `<option ${c.name === p.cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label>القسم الفرعي<select name="sub"></select></label>
  <label>السعر ($)<input name="price" type="number" min="0" step="any" required value="${p.price ?? ''}"></label>
  <label>السعر قبل الخصم ($) — اختياري<input name="old" type="number" min="0" step="any" value="${p.old || ''}"></label>
  <label>رابط الصورة<input name="img" value="${esc(p.img)}" placeholder="https://... أو icon/photo.jpg"></label></div>
  <label>وصف قصير<input name="desc" value="${esc(p.desc)}"></label>
  <label>المميزات (ميزة في كل سطر)<textarea name="features" rows="3">${esc((p.features || []).join('\n'))}</textarea></label>
  <div class="chks"><label><input type="checkbox" name="stock" ${p.stock !== false ? 'checked' : ''}> متوفر</label><label><input type="checkbox" name="visible" ${!p.hidden ? 'checked' : ''}> ظاهر في المتجر</label><label><input type="checkbox" name="isNew" ${p.badge === 'NEW' ? 'checked' : ''}> شارة "جديد"</label></div>
  <p class="err"></p><div class="bar"><button class="btn">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>`;
}
function fillSubs(f) {
  const c = CATS().find(x => x.name === f.elements.cat.value), cur = f.dataset.sub;
  f.elements.sub.innerHTML = '<option value="">—</option>' + (c ? c.subs : []).map(s => `<option ${s === cur ? 'selected' : ''}>${esc(s)}</option>`).join('');
}

function catsView() {
  const cs = CATS(), cat = catalog();
  return `<div class="head"><div><h1>الأقسام</h1><p class="sub">اسم القسم الأساسي مبيتغيرش بعد الإنشاء عشان المنتجات متتفصلش عنه.</p></div><button class="btn" data-act="cadd">+ قسم جديد</button></div>
  <div class="tw"><table><thead><tr><th>القسم</th><th>الأقسام الفرعية</th><th>المنتجات</th><th></th></tr></thead><tbody>${cs.map(c => `<tr><td><b>${esc(c.name)}</b></td><td class="wrap">${esc(c.subs.join('، ')) || '—'}</td><td>${cat.filter(p => p.cat === c.name).length}</td>
  <td><button class="mini" data-act="cedit" data-id="${esc(c.name)}">تعديل</button><button class="mini del" data-act="cdel" data-id="${esc(c.name)}">حذف</button></td></tr>`).join('')}</tbody></table></div>`;
}
function cform(c) {
  c = c || { subs: [] };
  return `<form id="cf" data-id="${esc(c.name || '')}"><h3>${c.name ? 'تعديل قسم' : 'قسم جديد'}</h3>
  <div class="g2"><label>اسم القسم<input name="name" required value="${esc(c.name)}" ${c.name ? 'readonly' : ''}></label><label>نص زر القسم<input name="shop" value="${esc(c.shop)}" placeholder="Shop ..."></label></div>
  <label>وصف قصير (الصفحة الرئيسية)<input name="desc" value="${esc(c.desc)}"></label>
  <label>وصف طويل (صفحة الأقسام)<input name="long" value="${esc(c.long)}"></label>
  <label>الأقسام الفرعية (افصل بينها بفاصلة)<input name="subs" value="${esc(c.subs.join(', '))}"></label>
  <p class="err"></p><div class="bar"><button class="btn">حفظ</button><button type="button" class="btn ghost" data-act="close">إلغاء</button></div></form>`;
}

function custView() {
  const acc = rd(K.acc, {}), o = orders().filter(x => x.s !== 'Cancelled'), news = rd(K.news, []);
  const rows = Object.keys(acc).map(id => { const mine = o.filter(x => x.user === id); return { a: acc[id], id, n: mine.length, v: mine.reduce((s, x) => s + x.total, 0) }; });
  return `<h1>العملاء</h1><p class="sub">الحسابات اللي اتسجلت من المتجر.</p>
  ${rows.length ? `<div class="tw"><table><thead><tr><th>الاسم</th><th>الإيميل / التليفون</th><th>الطلبات</th><th>إجمالي الشراء</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.a.name)}</b></td><td>${esc(r.id)}</td><td>${r.n}</td><td>${money(r.v)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty tw">مفيش حسابات لسه.</div>'}
  <div class="box" style="margin-top:14px"><h2>مشتركو النشرة (${news.length})</h2>${news.length ? news.map(e => `<span class="pill info" style="margin:3px">${esc(e)}</span>`).join('') : '<p class="empty">مفيش مشتركين.</p>'}</div>`;
}
function msgsView() {
  const m = rd(K.msgs, []);
  return `<h1>الرسائل</h1><p class="sub">الرسائل اللي جت من صفحة "اتصل بنا".</p>` + (m.length ? m.map(x => `<div class="msg ${x.read ? '' : 'new'}"><b>${esc(x.name)}</b> <span class="pill info">${esc(x.subject)}</span><br><small>${esc(x.email)} · ${esc(x.phone)} · ${when(x.time)}</small><p>${esc(x.message)}</p>
  <a class="mini" href="mailto:${esc(x.email)}">رد بالإيميل</a><button class="mini" data-act="mread" data-id="${esc(x.id)}">${x.read ? 'اعتبرها غير مقروءة' : 'تمت القراءة'}</button><button class="mini del" data-act="mdel" data-id="${esc(x.id)}">حذف</button></div>`).join('') : '<div class="empty tw">مفيش رسائل.</div>');
}

/* ---------- Router ---------- */
const NAV = [['dash', '📊', 'الرئيسية', dash], ['orders', '📦', 'الطلبات', ordersView], ['products', '🛍️', 'المنتجات', productsView], ['cats', '🗂️', 'الأقسام', catsView], ['cust', '👥', 'العملاء', custView], ['msgs', '✉️', 'الرسائل', msgsView]];
function render() {
  const k = location.hash.slice(1), cur = NAV.find(n => n[0] === k) || NAV[0];
  const active = orders().filter(o => ['Pending', 'Processing'].includes(o.s)).length, unread = rd(K.msgs, []).filter(m => !m.read).length;
  $('#nav').innerHTML = NAV.map(n => `<a href="#${n[0]}" class="${n === cur ? 'on' : ''}">${n[1]} ${n[2]}${n[0] === 'orders' && active ? `<b>${active}</b>` : ''}${n[0] === 'msgs' && unread ? `<b>${unread}</b>` : ''}</a>`).join('');
  $('#view').innerHTML = cur[3]();
}
function gate() { const ok = sessionStorage.getItem('boda_admin') === '1'; $('#login').hidden = ok; $('#app').hidden = !ok; if (ok) render(); }
addEventListener('hashchange', () => { if (!$('#app').hidden) render(); });
setInterval(() => { if (!$('#app').hidden && !$('#dlg').open && !document.activeElement.matches('input,select,textarea')) render(); }, 15000);

/* ---------- Actions ---------- */
function patchProduct(id, f) {
  const a = PA(), i = a.added.findIndex(p => p.id === id);
  if (i > -1) a.added[i] = { ...a.added[i], ...f }; else a.edits[id] = { ...(a.edits[id] || {}), ...f };
  wr(K.pa, a);
}
const open = html => { const d = $('#dlg'); d.innerHTML = html; d.showModal(); };
const ACT = {
  close: () => $('#dlg').close(),
  logout: () => { sessionStorage.removeItem('boda_admin'); gate(); },
  odetail: d => { const o = orders().find(x => x.id === d.id); if (!o) return;
    open(`<h3>طلب ${esc(o.id)} ${pill(o.s)}</h3><div class="tw"><table><tbody>${o.items.map(i => `<tr><td class="wrap">${esc(i.name)}</td><td>× ${i.qty}</td><td>${money(i.price * i.qty)}</td></tr>`).join('')}<tr><td><b>الإجمالي</b></td><td></td><td><b>${money(o.total)}</b></td></tr></tbody></table></div>
    <p style="margin:14px 0"><b>الشحن:</b> ${esc(o.ship?.name)} — ${esc(o.ship?.phone)}<br>${esc(o.ship?.address)}، ${esc(o.ship?.city)}<br><b>الدفع:</b> ${esc(o.payment)}<br><b>التاريخ:</b> ${when(o.created)}</p><button class="btn ghost" data-act="close">إغلاق</button>`); },
  odel: d => { if (!confirm('حذف الطلب نهائيًا؟')) return; wr(K.orders, rd(K.orders, []).filter(o => o.id !== d.id)); render(); toast('تم حذف الطلب'); },
  csv: () => {
    const rows = [['الطلب', 'التاريخ', 'العميل', 'التليفون', 'المدينة', 'الدفع', 'الإجمالي', 'الحالة']].concat(orders().map(o => [o.id, new Date(o.created).toISOString(), o.ship?.name, o.ship?.phone, o.ship?.city, o.payment, o.total, ST[o.s][0]]));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' })); a.download = 'boda-orders.csv'; a.click(); },
  padd: () => { open(pform()); fillSubs($('#pf')); },
  pedit: d => { const p = catalog().find(x => x.id === d.id); open(pform(p)); fillSubs($('#pf')); },
  pstock: d => { const p = catalog().find(x => x.id === d.id); patchProduct(d.id, { stock: p.stock === false }); $('#tbl').innerHTML = prodList(); },
  pvis: d => { const p = catalog().find(x => x.id === d.id); patchProduct(d.id, { hidden: !p.hidden }); $('#tbl').innerHTML = prodList(); },
  pdel: d => { if (!confirm('حذف المنتج من المتجر؟ (تقدر تسترجعه بعدين)')) return; const a = PA();
    if (baseIds().includes(d.id)) { a.deleted.push(d.id); delete a.edits[d.id]; } else a.added = a.added.filter(p => p.id !== d.id);
    wr(K.pa, a); render(); toast('تم الحذف'); },
  prestore: () => { const a = PA(); a.deleted = []; wr(K.pa, a); render(); toast('تم استرجاع المنتجات المحذوفة'); },
  cadd: () => open(cform()),
  cedit: d => open(cform(CATS().find(c => c.name === d.id))),
  cdel: d => { if (catalog().some(p => p.cat === d.id)) return alert('القسم ده فيه منتجات. انقل المنتجات أو احذفها الأول.'); if (!confirm('حذف القسم؟')) return;
    wr(K.cats, CATS().filter(c => c.name !== d.id)); render(); toast('تم حذف القسم'); },
  mread: d => { wr(K.msgs, rd(K.msgs, []).map(m => m.id === d.id ? { ...m, read: !m.read } : m)); render(); },
  mdel: d => { wr(K.msgs, rd(K.msgs, []).filter(m => m.id !== d.id)); render(); },
  backup: () => { const all = {}; Object.keys(localStorage).filter(k => k.startsWith('boda_')).forEach(k => all[k] = localStorage.getItem(k));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(all)], { type: 'application/json' })); a.download = 'boda-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); },
  restore: () => $('#file').click()
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) ACT[b.dataset.act](b.dataset, b); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg === 'ost') {
    const all = rd(K.orders, []), o = all.find(x => x.id === t.dataset.id); if (!o) return;
    o.cancelled = t.value === 'Cancelled'; o.status = t.value; o.manual = true; wr(K.orders, all);
    const n = rd(K.notifs, []); n.unshift({ text: 'Order ' + o.id + ' is now ' + t.value, href: 'index.html?page=orders', time: Date.now(), read: false }); wr(K.notifs, n.slice(0, 30));
    render(); toast('تم تحديث حالة الطلب');
  }
  if (t.id === 'file' && t.files[0]) {
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!confirm('هيتم استبدال بيانات المتجر الحالية بالنسخة دي. متأكد؟')) return;
      Object.keys(d).filter(k => k.startsWith('boda_')).forEach(k => localStorage.setItem(k, d[k])); render(); toast('تم الاسترجاع'); } catch (x) { alert('الملف مش صالح.'); } }; r.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'lf') { if (f.elements.u.value.trim() === ADMIN.user && f.elements.p.value === ADMIN.pass) { sessionStorage.setItem('boda_admin', '1'); gate(); } else $('#lerr').textContent = 'اسم المستخدم أو كلمة المرور غلط.'; return; }
  const err = f.querySelector('.err');
  if (f.id === 'pf') {
    const price = +f.elements.price.value, old = +f.elements.old.value || 0, name = f.elements.name.value.trim();
    if (!name || !(price >= 0)) { err.textContent = 'اكتب اسم المنتج وسعر صحيح.'; return; }
    const rec = { name, cat: f.elements.cat.value, sub: f.elements.sub.value, price, old: old > price ? old : 0, img: f.elements.img.value.trim(), desc: f.elements.desc.value.trim(), features: f.elements.features.value.split('\n').map(s => s.trim()).filter(Boolean), badge: f.elements.isNew.checked ? 'NEW' : '', stock: f.elements.stock.checked, hidden: !f.elements.visible.checked };
    const id = f.dataset.id;
    if (id) patchProduct(id, rec); else { const a = PA(); a.added.push({ ...rec, id: 'ADM' + Date.now().toString(36).toUpperCase() }); wr(K.pa, a); }
    $('#dlg').close(); render(); toast('تم حفظ المنتج');
  }
  if (f.id === 'cf') {
    const cs = CATS().map(c => ({ ...c })), name = f.elements.name.value.trim(), id = f.dataset.id;
    const rec = { name, icon: '', shop: f.elements.shop.value.trim() || 'Shop ' + name, desc: f.elements.desc.value.trim(), long: f.elements.long.value.trim() || f.elements.desc.value.trim(), subs: f.elements.subs.value.split(/[,،]/).map(s => s.trim()).filter(Boolean) };
    if (!name) { err.textContent = 'اكتب اسم القسم.'; return; }
    if (id) { const i = cs.findIndex(c => c.name === id); cs[i] = { ...cs[i], ...rec, name: id, icon: cs[i].icon }; }
    else { if (cs.some(c => c.name.toLowerCase() === name.toLowerCase())) { err.textContent = 'القسم ده موجود بالفعل.'; return; } cs.push(rec); }
    wr(K.cats, cs); $('#dlg').close(); render(); toast('تم حفظ القسم');
  }
});
window.S = S;
window.$ = $;
window.ordersList = ordersList;
window.prodList = prodList;
window.fillSubs = fillSubs;
gate();
})();
</script>
</template>
    <script>
        (function () {
            var page = new URLSearchParams(location.search).get('page') || 'home';
            var template = document.querySelector('template[data-page="' + page + '"]') || document.querySelector('template[data-page="home"]');
            var content = template.content.cloneNode(true);
            var scripts = Array.prototype.slice.call(content.querySelectorAll('script'));
            scripts.forEach(function (script) { script.remove(); });
            document.body.className = template.dataset.class || '';
            document.title = template.dataset.title || 'Boda Store';
            document.documentElement.lang = template.dataset.lang || 'en';
            document.documentElement.dir = template.dataset.dir || 'ltr';
            document.body.replaceChildren(content);
            window.addEventListener('load', function () {
                if (template.dataset.dir) {
                    document.documentElement.lang = template.dataset.lang || 'en';
                    document.documentElement.dir = template.dataset.dir;
                }
                scripts.forEach(function (source) {
                    var script = document.createElement('script');
                    script.textContent = source.textContent;
                    document.body.appendChild(script);
                });
            }, { once: true });
        })();
    </script>
</body>
