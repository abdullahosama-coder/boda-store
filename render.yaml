services:
  - type: web
    name: boda-store-api-abdullahosama
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py products-data.js && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: BODA_DATABASE_URL
        sync: false
      - key: BODA_ADMIN_USER
        value: admin
      - key: BODA_ADMIN_PASSWORD
        sync: false
      - key: BODA_SECRET_KEY
        generateValue: true
      - key: BODA_CORS_ORIGINS
        value: https://abdullahosama-coder.github.io,http://127.0.0.1:5500,http://localhost:5500
